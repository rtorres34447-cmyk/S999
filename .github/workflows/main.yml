name: Build S999 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'S999-MKamuy-V1.1-GitHub.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract MKamuy V1.1 source ZIP
        shell: bash
        run: |
          test -f S999-MKamuy-V1.1-GitHub.zip
          mkdir -p /tmp/s999-source
          unzip -q S999-MKamuy-V1.1-GitHub.zip -d /tmp/s999-source
          test -f /tmp/s999-source/settings.gradle
          test -f /tmp/s999-source/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo 'Android sdkmanager not found in installed SDK' >&2
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MKamuy V1.1 debug APK
        working-directory: /tmp/s999-source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S999-MKamuy-V1.1-APK
          path: /tmp/s999-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
