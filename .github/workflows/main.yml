name: Build S999 MKamuy V2 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'S999-MKamuy-V2-GitHub.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V2 project
        shell: bash
        run: |
          set -euo pipefail
          test -f S999-MKamuy-V2-GitHub.zip || { echo '::error::Upload S999-MKamuy-V2-GitHub.zip to the repository root'; exit 1; }
          mkdir -p "$RUNNER_TEMP/s999-project"
          unzip -oq S999-MKamuy-V2-GitHub.zip -d "$RUNNER_TEMP/s999-project"
          test -f "$RUNNER_TEMP/s999-project/settings.gradle" || { echo '::error::settings.gradle missing from project ZIP'; exit 1; }
          test -f "$RUNNER_TEMP/s999-project/app/build.gradle" || { echo '::error::app/build.gradle missing from project ZIP'; exit 1; }
          echo "PROJECT_DIR=$RUNNER_TEMP/s999-project" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK (show detailed errors)
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/s999-build.log"

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: S999-V2-build-log
          path: ${{ runner.temp }}/s999-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S999-MKamuy-V2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
