name: Build S999 MKamuy V2 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'S999-MKamuy-V2-GitHub.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V2 Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f S999-MKamuy-V2-GitHub.zip || { echo '::error::Missing S999-MKamuy-V2-GitHub.zip in repository root'; exit 1; }
          mkdir -p "$RUNNER_TEMP/s999-v2"
          unzip -q S999-MKamuy-V2-GitHub.zip -d "$RUNNER_TEMP/s999-v2"
          test -f "$RUNNER_TEMP/s999-v2/settings.gradle" || { echo '::error::settings.gradle is missing from V2 ZIP'; exit 1; }
          test -f "$RUNNER_TEMP/s999-v2/app/build.gradle" || { echo '::error::app/build.gradle is missing from V2 ZIP'; exit 1; }
          echo "PROJECT_DIR=$RUNNER_TEMP/s999-v2" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub Ubuntu runners already include the Android SDK command-line tools.
      # Do not use android-actions/setup-android@v3 here: its default
      # 'tools' package is obsolete and causes 'Failed to find package tools'.
      - name: Install Android 35 SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER" || { echo '::error::SDK manager not found on runner'; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile V2 debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/s999-v2-build.log"

      - name: Upload diagnostic log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: S999-V2-build-log
          path: ${{ runner.temp }}/s999-v2-build.log
          if-no-files-found: ignore

      - name: Upload MKamuy V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: S999-MKamuy-V2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
