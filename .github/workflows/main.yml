name: Build S999 MKamuy V2 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'S999-MKamuy-V2-GitHub.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract exact V2 project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f S999-MKamuy-V2-GitHub.zip
          mkdir -p "$RUNNER_TEMP/s999-v2"
          unzip -q S999-MKamuy-V2-GitHub.zip -d "$RUNNER_TEMP/s999-v2"
          test -f "$RUNNER_TEMP/s999-v2/settings.gradle"
          test -f "$RUNNER_TEMP/s999-v2/app/build.gradle"
          echo "PROJECT_DIR=$RUNNER_TEMP/s999-v2" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build S999 MKamuy V2 debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: S999-MKamuy-V2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
