
name: Build S999 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract S999 project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' | head -1)
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found"
            exit 1
          fi
          mkdir -p /tmp/s999project
          unzip -q "$ZIP" -d /tmp/s999project
          PROJECT=$(find /tmp/s999project -name settings.gradle -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "settings.gradle missing from ZIP"
            exit 1
          fi
          cp -a "$(dirname "$PROJECT")/." .
          test -f app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find SDK manager
        shell: bash
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK
        run: |
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S999-MKamuy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
